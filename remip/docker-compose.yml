services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: remip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remip_dev_password}
      POSTGRES_DB: remip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remip"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for listing-version snapshots (M4). Backend
  # falls back to local disk when unset, so this is optional in plain
  # `uvicorn` dev but always on via Compose.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: remip
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-remip_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment: &backend_env
      REMIP_DATABASE_URL: postgresql+psycopg2://remip:${POSTGRES_PASSWORD:-remip_dev_password}@db:5432/remip
      REMIP_SECRET_KEY: ${REMIP_SECRET_KEY:?set REMIP_SECRET_KEY in .env}
      REMIP_ENVIRONMENT: development
      REMIP_SEED_ON_STARTUP: "true"
      REMIP_REDIS_URL: redis://redis:6379/0
      REMIP_S3_ENDPOINT_URL: http://minio:9000
      REMIP_S3_BUCKET: remip-snapshots
      REMIP_S3_ACCESS_KEY: remip
      REMIP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-remip_dev_password}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # One-off Alembic migration runner (M6) — not started by a plain
  # `docker compose up`, only via `docker compose --profile tools run --rm
  # migrate`. The backend's own lifespan still calls
  # Base.metadata.create_all on startup for zero-friction dev (harmless
  # no-op once Alembic has already created the same tables — SQLAlchemy
  # skips tables that already exist), so nothing breaks if this step is
  # skipped in local dev; it's the recommended step before the first `up`
  # against a real deployment (see docs/DEPLOYMENT.md).
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Consumes ingestion jobs enqueued by the scheduler (or an admin manual
  # trigger). See docs/ARCHITECTURE.md for the job-queue design.
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Periodically enqueues ingestion jobs for every enabled DataProvider that
  # has a registered adapter (today: omi_it). Runs once immediately on
  # startup, then every REMIP_INGESTION_INTERVAL_MINUTES (default 360).
  scheduler:
    build: ./backend
    command: python -m app.scheduler
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL of the backend as reachable from the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
