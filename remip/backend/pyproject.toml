[project]
name = "remip-backend"
version = "0.1.0"
description = "REMIP - Real Estate Market Intelligence Platform (backend API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "redis>=5.0",
    "rq>=1.16",
    "apscheduler>=3.10",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]
postgres = ["psycopg2-binary>=2.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
