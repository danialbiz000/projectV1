[project]
name = "remip-backend"
version = "0.1.0"
description = "REMIP - Real Estate Market Intelligence Platform (backend API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "redis>=5.0",
    "rq>=1.16",
    "apscheduler>=3.10",
    "boto3>=1.34",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
postgres = ["psycopg2-binary>=2.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migration files must stay exactly what `alembic revision --autogenerate`
# produced — the DB schema history, not something to hand-reformat — so
# they're excluded from lint/type-check the same way most Alembic setups do.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, ruff only infers "app" as first-party for files that live
# inside the app/ package itself — a file elsewhere in the repo (like
# alembic/env.py) would otherwise get app.* imports alphabetized in with
# third-party ones instead of grouped separately, unlike every other file.
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query()/Depends() in argument defaults is the documented DI
# pattern, not a mutable-default bug; B008 only auto-exempts a narrow shape
# (single simple literal default) so a *required* Query(..., min_length=…)
# still trips it. This is ruff's own supported allowlist for that.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests", "alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
