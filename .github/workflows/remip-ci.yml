name: REMIP CI

on:
  push:
    paths:
      - "remip/**"
      - ".github/workflows/remip-ci.yml"
  pull_request:
    paths:
      - "remip/**"
      - ".github/workflows/remip-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remip/backend
    services:
      # Real queue for the ingestion job-queue path (M4); tests also verify
      # the Redis-unreachable inline fallback explicitly, so this service is
      # about exercising the "happy path" rather than being load-bearing.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest -q
        env:
          REMIP_REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remip/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend for E2E
        run: pip install -e "../backend"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npx playwright test
